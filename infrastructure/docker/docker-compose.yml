version: '3.9'

services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r /app/requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../../apps/api:/app
    ports:
      - '8000:8000'
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/govbridge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../../apps/web:/app
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: govbridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
